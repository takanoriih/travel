<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <style>
      .title{font-family:'Hiragino Mincho Pro','Yu Mincho','Noto Serif JP',serif;font-weight:900;fill:#fff}
      .sub{font-family:'Hiragino Kaku Gothic Pro','Noto Sans JP',sans-serif;font-weight:600;fill:rgba(255,255,255,.92)}
      .tag{font-family:Georgia,serif;font-style:italic;fill:rgba(255,255,255,.7);letter-spacing:.4em}
      .label{font-family:Georgia,serif;fill:rgba(255,255,255,.6);letter-spacing:.3em;font-size:18px}
      .chip{font-family:'Hiragino Kaku Gothic Pro','Noto Sans JP',sans-serif;font-weight:700;fill:#fff;font-size:22px}
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 装飾フレーム -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="2" rx="4"/>
  <rect x="42" y="42" width="1116" height="546" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1" rx="2"/>

  <!-- 背景の薄い円 -->
  <circle cx="1050" cy="120" r="180" fill="rgba(14,165,233,.18)"/>
  <circle cx="120" cy="540" r="200" fill="rgba(99,102,241,.18)"/>

  <!-- 上部タグ -->
  <text x="600" y="115" text-anchor="middle" class="tag" font-size="22">TRAVEL ITINERARY</text>

  <!-- 飛行機絵文字 -->
  <text x="600" y="225" text-anchor="middle" font-size="92">✈️</text>

  <!-- メインタイトル -->
  <text x="600" y="340" text-anchor="middle" class="title" font-size="92">旅のしおり</text>

  <!-- 装飾 -->
  <text x="600" y="385" text-anchor="middle" class="tag" font-size="20">❖ ❖ ❖</text>

  <!-- 説明文 -->
  <text x="600" y="445" text-anchor="middle" class="sub" font-size="30">行き先を選ぶだけで、旅程を一冊のしおりに。</text>
  <text x="600" y="485" text-anchor="middle" class="sub" font-size="22" opacity=".85">タイムテーブル ／ 持ち物リスト ／ 予算 ／ メモ — まとめて印刷</text>

  <!-- 下部のチップ -->
  <g transform="translate(600,540)">
    <g transform="translate(-260,0)">
      <rect x="-78" y="-22" width="156" height="44" rx="22" fill="rgba(255,255,255,.18)" stroke="rgba(255,255,255,.4)"/>
      <text x="0" y="8" text-anchor="middle" class="chip">🗺️ 12のテンプレ</text>
    </g>
    <g transform="translate(0,0)">
      <rect x="-78" y="-22" width="156" height="44" rx="22" fill="rgba(255,255,255,.18)" stroke="rgba(255,255,255,.4)"/>
      <text x="0" y="8" text-anchor="middle" class="chip">🖨️ 表紙付き印刷</text>
    </g>
    <g transform="translate(260,0)">
      <rect x="-78" y="-22" width="156" height="44" rx="22" fill="rgba(255,255,255,.18)" stroke="rgba(255,255,255,.4)"/>
      <text x="0" y="8" text-anchor="middle" class="chip">📱 ブラウザ完結</text>
    </g>
  </g>

  <!-- フッター -->
  <text x="600" y="600" text-anchor="middle" class="label">— HAVE A WONDERFUL JOURNEY —</text>
</svg>
